<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | N.F International</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">

  <div class="login-card">
    <!-- Logo & Branding -->
    <div class="login-logo">
      <img src="../assets/images/official_logo.jpg" alt="N.F International">
      <h1>Admin Panel</h1>
      <span>N.F International &mdash; Staff Access Only</span>
    </div>
    <hr class="login-separator">

    <!-- Error Alert -->
    <div class="login-error" id="loginError">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span>Invalid username or password. Please try again.</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="loginUser"><i class="fa-solid fa-user"></i> Username</label>
        <input
          type="text"
          id="loginUser"
          class="form-control"
          placeholder="Enter admin username"
          required
          autocomplete="off"
        >
      </div>

      <div class="form-group">
        <label for="loginPass"><i class="fa-solid fa-lock"></i> Password</label>
        <div class="form-control-wrap" style="position:relative;">
          <input
            type="password"
            id="loginPass"
            class="form-control"
            placeholder="Enter admin password"
            required
            autocomplete="current-password"
          >
          <button type="button" id="togglePass" style="position:absolute; right:0.75rem; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); cursor:pointer;">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="margin-top:0.5rem;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Login to Admin Panel
      </button>
    </form>

    <div style="margin-top: 1.75rem; text-align:center; border-top: 1px solid var(--border-subtle); padding-top: 1.25rem;">
      <a href="../index.html" style="font-size: 0.85rem; color: var(--text-muted);">
        <i class="fa-solid fa-arrow-left"></i> Back to Main Website
      </a>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    initLoginPage();

    // Toggle password visibility
    document.getElementById('togglePass').addEventListener('click', function () {
      const inp = document.getElementById('loginPass');
      const icon = this.querySelector('i');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        inp.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    });
  </script>
</body>
</html>
